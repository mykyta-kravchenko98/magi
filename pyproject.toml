[project]
name = "magi"
version = "0.1.0"
description = "Modular-monolith backend for Magi"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "minio>=7.2.15,<8",
    "pdfplumber>=0.11.10,<0.12",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "urllib3>=2,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
magi-migrate = "magi.bootstrap.migrations:main"

[dependency-groups]
dev = [
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "reportlab>=4.4,<5",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: requires the complete application stack",
    "integration: requires explicitly configured external services",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.uv]
default-groups = ["dev"]
