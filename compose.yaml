name: magi

services:
  api:
    build: .
    environment:
      MAGI_DATABASE_URL: postgresql+asyncpg://magi:magi@postgres:5432/magi
      MAGI_DOCS_ENABLED: "true"
      MAGI_ENVIRONMENT: development
      MAGI_MAX_UPLOAD_BYTES: "20971520"
      MAGI_CHUNK_MAX_CHARS: "2000"
      MAGI_CHUNK_OVERLAP_CHARS: "200"
      MAGI_OBJECT_STORAGE_ENDPOINT: minio:9000
      MAGI_OBJECT_STORAGE_ACCESS_KEY: magi
      MAGI_OBJECT_STORAGE_SECRET_KEY: magi-minio-secret
      MAGI_OBJECT_STORAGE_BUCKET: magi-sources
      MAGI_OBJECT_STORAGE_SECURE: "false"
      MAGI_EMBEDDING_BASE_URL: http://tei:80
      MAGI_EMBEDDING_MODEL_ID: Qwen/Qwen3-Embedding-0.6B
      MAGI_EMBEDDING_MODEL_REVISION: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      MAGI_EMBEDDING_VECTOR_DIMENSION: "1024"
      MAGI_EMBEDDING_BATCH_SIZE: "16"
      MAGI_EMBEDDING_TIMEOUT_SECONDS: "30"
      MAGI_QDRANT_URL: http://qdrant:6333
      MAGI_QDRANT_COLLECTION: ${MAGI_QDRANT_COLLECTION:-magi_knowledge_chunks_qwen3_06b_v1}
      MAGI_QDRANT_VECTOR_DIMENSION: "1024"
      MAGI_QDRANT_BATCH_SIZE: "64"
      MAGI_QDRANT_TIMEOUT_SECONDS: "10"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrations:
    build: .
    command: [magi-migrate]
    environment:
      MAGI_DATABASE_URL: postgresql+asyncpg://magi:magi@postgres:5432/magi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: magi
      POSTGRES_USER: magi
      POSTGRES_PASSWORD: magi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U magi -d magi]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: magi
      MINIO_ROOT_PASSWORD: magi-minio-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  tei:
    profiles: [gpu]
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9.3
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    init: true
    restart: unless-stopped
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-0.6B
      - --revision
      - 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --dtype
      - float16
      - --max-client-batch-size
      - "16"
      - --max-batch-tokens
      - "8192"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - tei-model-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://localhost:80/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30m
    stop_grace_period: 30s

volumes:
  postgres-data:
  minio-data:
  qdrant-data:
  tei-model-cache:

